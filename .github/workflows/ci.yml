name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # near-workspaces -> near-jsonrpc-client -> native-tls -> openssl-sys
      # needs pkg-config and the OpenSSL development headers.
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev

      # rust-toolchain.toml pins the compiler and adds rustfmt, clippy and the wasm target.
      - name: Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-near
        run: cargo install cargo-near --locked --no-default-features

      - name: Check prerequisites
        run: bash scripts/check-prereqs.sh

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (host, incl. tests)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (wasm, normal and failure-injection builds)
        run: |
          cargo clippy --target wasm32-unknown-unknown -p nearodds-market -p test-collateral -- -D warnings
          cargo clippy --target wasm32-unknown-unknown -p nearodds-market --features test-failure-injection -- -D warnings

      - name: Build Wasm
        run: bash scripts/build-wasm.sh

      - name: Unit and Sandbox tests
        run: NEARODDS_SKIP_WASM_BUILD=1 cargo test --workspace

      - name: Upload Wasm
        uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: |
            target/wasm/market.wasm
            target/wasm/test_collateral.wasm

  backend:
    # Needs the Wasm artifacts built by the contracts job. Integration tests (PostgreSQL + NEAR Sandbox) are REQUIRED here:
    # a missing prerequisite fails the job instead of skipping tests.
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      TEST_DATABASE_ADMIN_URL: postgres://nearodds:nearodds@localhost:5432/postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nearodds
          POSTGRES_PASSWORD: nearodds
          POSTGRES_DB: nearodds
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nearodds" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck backend and shared types
        run: pnpm --filter @nearodds/backend typecheck

      - name: Wasm artifacts from the contracts job
        uses: actions/download-artifact@v4
        with:
          name: wasm
          path: target/wasm

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev
      - name: Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # The near-sandbox crate's build script downloads the sandbox node binary the tests start.
      # (`cargo build -p near-sandbox` panics inside cargo's feature resolver on this toolchain, so build the dependent tests instead.)
      - name: Fetch NEAR Sandbox binary
        run: NEARODDS_SKIP_WASM_BUILD=1 cargo test -p nearodds-market --no-run

      - name: Backend tests (PostgreSQL + Sandbox, no skips allowed)
        run: pnpm --filter @nearodds/backend test:ci

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: apps/backend/test-report.json
