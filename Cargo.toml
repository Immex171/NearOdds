[workspace]
resolver = "2"
members = ["contracts/market", "contracts/test-collateral"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.dependencies]
near-sdk = "5.30.0"
near-contract-standards = "5.30.0"
near-workspaces = "0.24.0"
tokio = { version = "1", features = ["full"] }
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
